[project]
name = "codecraftai-timetravel-server"
version = "1.3.1"
description = "Code Craft AI - Time Travel Server"
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Source-Available"
authors = [{name = "Myron Walker", email = "myron.walker@gmail.com"}]
keywords = [
    "python"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "sqlalchemy>=2.0.48,<3.0.0",
    "alembic>=1.18.4,<2.0.0",
]

[project.urls]
Repository = "https://github.com/code-craft-ai-company/codecraftai-timetravel-server"
Issues = "https://github.com/code-craft-ai-company/codecraftai-timetravel-server/issues"

[dependency-groups]
dev = [
    # The level-5 REST APIs under source/site were refactored onto webworks'
    # RestBlueprint (commit 07e0830) but webworks was never declared, so every
    # module importing them failed. testbase backs the resource-based suite
    # under source/testroots/ccai.
    "codecraftai-webworks>=1.0.0,<2.0.0",
    "codecraftai-testbase>=1.0.0,<2.0.0",
    "myst-parser>=0.18.1,<0.19.0",
    "sphinx>=1.6,<6",
    "sphinx-rtd-theme>=1.1.1,<2.0.0",
]

[tool.poetry]
packages = [{include="ccai", from="source/packages"}]

[tool.ruff.lint]
# Deliberately narrow.  This gate exists for one reason: a bare `except:`
# swallows ConfigurationError and SemanticError, which derive from
# BaseException precisely so that they pass through ordinary handlers and end
# the run.  Catching them hides the original cause behind whatever error
# happens next.  See userguide/10-00-coding-standards.rst, exception-handling
# rules 5-7.  Use `except Exception:` when you mean "any ordinary failure".
select = ["E722"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
