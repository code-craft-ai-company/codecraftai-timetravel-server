[tool.poetry]
name = "automojo-timetravel-server"
description = "Automation Mojo - Time Travel Server"
version = "0.0.1"
authors = []
readme = "README.md"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="automojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
automojo-webworks = { git = "https://github.com/automationmojo/automojo-webworks.git", branch = "main" }
sqlalchemy = "^2.0.48"
alembic = "^1.18.4"
flask = "^3.1.3"
flask-restx = "^1.3.2"
pytest = "^9.0.2"
pytest-flask = "^1.3.0"

[tool.poetry.group.dev.dependencies]
myst-parser = "^0.18.1"
sphinx = ">=1.6,<6"
sphinx-rtd-theme = "^1.1.1"

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
