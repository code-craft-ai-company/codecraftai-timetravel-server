[tool.poetry]
name = "codecraftai-timetravel-server"
description = "Code Craft AI - Time Travel Server"
version = "0.0.1"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
sqlalchemy = "^2.0.48"
alembic = "^1.18.4"

[tool.poetry.group.dev.dependencies]
# The level-5 REST APIs under source/site were refactored onto webworks'
# RestBlueprint (commit 07e0830) but webworks was never declared, so every
# module importing them failed. testbase backs the resource-based suite
# under source/testroots/ccai.
codecraftai-webworks = { git = "https://github.com/automationmojo/codecraftai-webworks.git", branch = "main" }
codecraftai-testbase = { git = "https://github.com/automationmojo/codecraftai-testbase.git", branch = "main" }
pytest = "^9.0.2"
myst-parser = "^0.18.1"
sphinx = ">=1.6,<6"
sphinx-rtd-theme = "^1.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
